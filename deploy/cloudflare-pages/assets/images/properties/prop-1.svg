  <rect x="40" y="40" width="180" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="55" y="62" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">FOR SALE · PENTHOUSE</text>
  <!-- Title overlay -->
  <text x="40" y="420" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">The Obsidian Penthouse</text>
  <text x="40" y="450" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Manhattan, NY · 4 Beds · 4.5 Baths · 4,200 sqft · $4,850,000</text>
  <rect x="620" y="40" width="140" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="640" y="66" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="800">$4.85M</text>
</svg>