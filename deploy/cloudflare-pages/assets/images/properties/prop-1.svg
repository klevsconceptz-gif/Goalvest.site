<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#070c18"/><stop offset="50%" stop-color="#0b172b"/><stop offset="100%" stop-color="#050a12"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Sunset skyline silhouette -->
  <path d="M 0 380 L 80 340 L 110 370 L 170 300 L 220 300 L 250 350 L 320 260 L 350 260 L 370 290 L 420 220 L 460 220 L 490 280 L 560 190 L 600 190 L 640 310 L 710 240 L 760 240 L 800 290 L 800 500 L 0 500 Z" fill="#030712" opacity="0.9"/>
  <!-- Glass architectural tower facade -->
  <polygon points="260,80 540,80 510,460 290,460" fill="url(#glass)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Penthouse window grid -->
  <line x1="280" y1="140" x2="520" y2="140" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="285" y1="200" x2="515" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="290" y1="260" x2="510" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="295" y1="320" x2="505" y2="320" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="300" y1="380" x2="500" y2="380" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="380" y1="80" x2="380" y2="460" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="420" y1="80" x2="420" y2="460" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
