<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Primary Metadata -->
  <title>GoalVest - Goal-Based Investing, Real Assets &amp; Marketplace</title>
  <meta name="description" content="GoalVest is a modern fintech platform unifying goal-based wealth planning ($100 to $10M), stock market heatmaps, crypto trading, real estate REITs, Tesla electric vehicles, and robotics." />
  <meta name="keywords" content="GoalVest, goal-based investing, fintech, wealth management, stock market, S&P 500 heatmap, crypto trading, REITs, real estate mortgages, Tesla vehicles, Optimus robots, fintech platform" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="GoalVest Ecosystem" />
  <meta name="theme-color" content="#060b14" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="https://goalvest.dev" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://goalvest.dev" />
  <meta property="og:title" content="GoalVest - Modern Goal-Based Wealth &amp; Next-Gen Asset Platform" />
  <meta property="og:description" content="Unified financial infrastructure: tiered wealth goals, S&P 500 heatmap, crypto trading suite, luxury properties, and frontier technology reservations." />
  <meta property="og:image" content="https://goalvest.dev/assets/images/cards/og-preview.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://goalvest.dev" />
  <meta name="twitter:title" content="GoalVest - Wealth &amp; Multi-Asset Ecosystem" />
  <meta name="twitter:description" content="Tier investing from $100 to $10M, tech equities, crypto, properties, and hardware." />
  <meta name="twitter:image" content="https://goalvest.dev/assets/images/cards/og-preview.png" />

  <!-- Favicon & Web Manifest -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Local Stylesheet (Zero external runtime dependencies) -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Public Top Navigation Bar (Shown on Landing Page) -->
  <header id="nav-container" class="public-nav"></header>

  <!-- App Shell: Contains Fixed Sidebar & Responsive Viewport -->
  <div class="app-shell">
    <!-- Authenticated Sidebar (Desktop) -->
    <aside id="sidebar-container" class="sidebar" style="display: none;"></aside>

    <!-- Main Dynamic Viewport -->
    <main id="main-viewport" class="main-viewport">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation (Shown on mobile devices) -->
  <nav id="bottom-nav-container" class="mobile-bottom-nav"></nav>

  <!-- Authentication Modal (Sign In / Sign Up / Password Reset) -->
  <div id="auth-modal" class="modal-backdrop">
    <div id="auth-modal-content" class="modal-card"></div>
  </div>

  <!-- General Purpose Modal (Goals, Transfers, Trades, Property & Product Details) -->
  <div id="general-modal" class="modal-backdrop">
    <div id="general-modal-card" class="modal-card"></div>
  </div>

  <!-- Toast Notification System -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Logic Scripts (Strictly local, no external runtime scripts) -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/modals.js"></script>
</body>
</html>
